<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Bán hàng - Quán Ăn</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <div class="container mx-auto p-4 max-w-7xl">
        <header class="mb-6 text-center">
            <h1 class="text-3xl font-bold text-orange-600">Ứng dụng Bán Hàng</h1>
            <p class="text-gray-500">Cập nhật bảng giá mới nhất (Mang đi & Tại quán)</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- CỘT TRÁI: DANH MỤC MÓN ĂN (2/3 màn hình) -->
            <div class="lg:col-span-2 space-y-6">
                <!-- Ô tìm kiếm và chọn hình thức -->
                <div class="bg-white p-4 rounded-xl shadow-md space-y-4">
                    <div class="flex items-center justify-between">
                        <span class="font-semibold text-gray-700">Hình thức phục vụ chung:</span>
                        <div class="flex space-x-4">
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="radio" name="orderType" value="mang_di" checked onchange="changeOrderType()" class="text-orange-600 focus:ring-orange-500">
                                <span class="font-medium">Mang đi</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="radio" name="orderType" value="an_tai_quan" onchange="changeOrderType()" class="text-orange-600 focus:ring-orange-500">
                                <span class="font-medium">Ăn tại quán</span>
                            </label>
                        </div>
                    </div>
                    <!-- Ô gõ tên món để tìm kiếm -->
                    <div>
                        <input type="text" id="search-input" oninput="filterMenu()" placeholder="🔍 Gõ tên món để tìm kiếm nhanh..." class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
                    </div>
                </div>

                <!-- Danh sách Combo -->
                <div class="bg-white p-5 rounded-xl shadow-md">
                    <h2 class="text-xl font-bold text-orange-500 mb-4 border-b pb-2">📦 Danh sách Combo</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="combo-list">
                        <!-- Render bằng Javascript -->
                    </div>
                </div>

                <!-- Danh sách Món lẻ -->
                <div class="bg-white p-5 rounded-xl shadow-md">
                    <h2 class="text-xl font-bold text-blue-600 mb-4 border-b pb-2">🍜 Danh sách Món Lẻ</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="single-list">
                        <!-- Render bằng Javascript -->
                    </div>
                </div>
            </div>

            <!-- CỘT PHẢI: HÓA ĐƠN / BILL (1/3 màn hình) -->
            <div class="bg-white p-5 rounded-xl shadow-md flex flex-col justify-between h-fit sticky top-4">
                <div>
                    <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2 flex justify-between items-center">
                        <span>🛒 Hóa đơn hiện tại</span>
                        <button onclick="clearCart()" class="text-xs text-red-500 hover:underline">Xóa tất cả</button>
                    </h2>

                    <div id="cart-items" class="space-y-3 max-h-[400px] overflow-y-auto pr-1">
                        <p class="text-gray-400 text-center py-8">Chưa có món nào được chọn</p>
                    </div>
                </div>

                <div class="border-t mt-6 pt-4 space-y-3">
                    <div class="flex justify-between text-lg font-bold">
                        <span>Tổng tiền:</span>
                        <span id="total-amount" class="text-orange-600">0 đ</span>
                    </div>
                    <button onclick="checkout()" class="w-full bg-orange-600 text-white py-3 rounded-lg font-bold hover:bg-orange-700 transition shadow-lg">
                        In / Thanh Toán
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Dữ liệu bảng giá mới cập nhật
        const combos = [
            { name: "Bánh mì + trà tắc", mangDi: 30000, taiQuan: 39000 },
            { name: "Bánh mì + cà phê sữa", mangDi: 33000, taiQuan: 41000 },
            { name: "Bánh mì + nước ép", mangDi: 35000, taiQuan: 44000 },
            { name: "Bún sốt tương đậu + trà tắc", mangDi: 35000, taiQuan: 44000 },
            { name: "Bún sốt tương đậu + cà phê sữa", mangDi: 38000, taiQuan: 46000 },
            { name: "Bún sốt tương đậu + nước ép", mangDi: 40000, taiQuan: 49000 },
            { name: "Bún sốt tương đậu đặc biệt + trà tắc", mangDi: 40000, taiQuan: 49000 },
            { name: "Bún sốt tương đậu đặc biệt + cà phê sữa", mangDi: 43000, taiQuan: 51000 },
            { name: "Bún sốt tương đậu đặc biệt + nước ép", mangDi: 45000, taiQuan: 56000 },
            { name: "Bún nước tương + trà tắc", mangDi: 37000, taiQuan: 46000 },
            { name: "Bún nước tương + cà phê sữa", mangDi: 40000, taiQuan: 48000 },
            { name: "Bún nước tương + nước ép", mangDi: 42000, taiQuan: 51000 }
        ];

        const singles = [
            { name: "Bánh mì", mangDi: 20000, taiQuan: 20000 },
            { name: "Bún thịt nướng", mangDi: 27000, taiQuan: 27000 },
            { name: "Bún sốt tương đậu", mangDi: 25000, taiQuan: 25000 },
            { name: "Bún sốt tương đậu đặc biệt", mangDi: 30000, taiQuan: 30000 },
            { name: "Bún nước tương", mangDi: 27000, taiQuan: 27000 },
            { name: "Bánh mì ốp la", mangDi: 17000, taiQuan: 17000 }
        ];

        let cart = [];
        let currentType = 'mang_di';

        function formatMoney(amount) {
            return amount.toLocaleString('vi-VN') + ' đ';
        }

        function isItemSelected(category, index) {
            return cart.some(item => item.category === category && item.index === index);
        }

        function renderMenu(filteredCombos = combos, filteredSingles = singles) {
            // Render Combo
            const comboContainer = document.getElementById('combo-list');
            if (filteredCombos.length === 0) {
                comboContainer.innerHTML = `<p class="text-gray-400 text-sm col-span-2 text-center py-4">Không tìm thấy combo phù hợp</p>`;
            } else {
                comboContainer.innerHTML = filteredCombos.map((item) => {
                    const originalIndex = combos.indexOf(item);
                    const selected = isItemSelected('combo', originalIndex);
                    
                    const cardStyle = selected 
                        ? "bg-green-50 border-green-500 shadow-sm ring-1 ring-green-500" 
                        : "bg-orange-50/40 border-gray-200 hover:shadow-md";

                    return `
                        <div class="border rounded-lg p-3 flex flex-col justify-between transition duration-200 ${cardStyle}">
                            <div>
                                <div class="flex justify-between items-start">
                                    <h3 class="font-semibold text-gray-800 text-sm mb-1">${item.name}</h3>
                                    ${selected ? '<span class="text-xs bg-green-600 text-white px-1.5 py-0.5 rounded font-bold">Đã chọn</span>' : ''}
                                </div>
                                <p class="text-xs text-gray-500">Giá: ${formatMoney(currentType === 'mang_di' ? item.mangDi : item.taiQuan)}</p>
                            </div>
                            <button onclick="addToCart('combo', ${originalIndex})" class="mt-3 bg-orange-500 text-white text-xs py-1.5 px-3 rounded hover:bg-orange-600 transition font-medium">
                                + Thêm Combo
                            </button>
                        </div>
                    `;
                }).join('');
            }

            // Render Món lẻ
            const singleContainer = document.getElementById('single-list');
            if (filteredSingles.length === 0) {
                singleContainer.innerHTML = `<p class="text-gray-400 text-sm col-span-2 text-center py-4">Không tìm thấy món lẻ phù hợp</p>`;
            } else {
                singleContainer.innerHTML = filteredSingles.map((item) => {
                    const originalIndex = singles.indexOf(item);
                    const selected = isItemSelected('single', originalIndex);

                    const cardStyle = selected 
                        ? "bg-green-50 border-green-500 shadow-sm ring-1 ring-green-500" 
                        : "bg-blue-50/40 border-gray-200 hover:shadow-md";

                    return `
                        <div class="border rounded-lg p-3 flex flex-col justify-between transition duration-200 ${cardStyle}">
                            <div>
                                <div class="flex justify-between items-start">
                                    <h3 class="font-semibold text-gray-800 text-sm mb-1">${item.name}</h3>
                                    ${selected ? '<span class="text-xs bg-green-600 text-white px-1.5 py-0.5 rounded font-bold">Đã chọn</span>' : ''}
                                </div>
                                <p class="text-xs text-gray-500">Giá: ${formatMoney(currentType === 'mang_di' ? item.mangDi : item.taiQuan)}</p>
                            </div>
                            <button onclick="addToCart('single', ${originalIndex})" class="mt-3 bg-blue-600 text-white text-xs py-1.5 px-3 rounded hover:bg-blue-700 transition font-medium">
                                + Thêm Lẻ
                            </button>
                        </div>
                    `;
                }).join('');
            }
        }

        function filterMenu() {
            const keyword = document.getElementById('search-input').value.toLowerCase().trim();
            const matchedCombos = combos.filter(item => item.name.toLowerCase().includes(keyword));
            const matchedSingles = singles.filter(item => item.name.toLowerCase().includes(keyword));
            renderMenu(matchedCombos, matchedSingles);
        }

        function changeOrderType() {
            const radios = document.getElementsByName('orderType');
            for (const radio of radios) {
                if (radio.checked) {
                    currentType = radio.value;
                    break;
                }
            }
            cart.forEach(item => {
                const source = item.category === 'combo' ? combos[item.index] : singles[item.index];
                item.price = currentType === 'mang_di' ? source.mangDi : source.taiQuan;
            });
            filterMenu();
            renderCart();
        }

        function addToCart(category, index) {
            const source = category === 'combo' ? combos[index] : singles[index];
            const price = currentType === 'mang_di' ? source.mangDi : source.taiQuan;
            
            const existingItem = cart.find(i => i.category === category && i.index === index);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({
                    category: category,
                    index: index,
                    name: source.name,
                    price: price,
                    quantity: 1
                });
            }
            filterMenu();
            renderCart();
        }

        function updateQuantity(cartIndex, delta) {
            cart[cartIndex].quantity += delta;
            if (cart[cartIndex].quantity <= 0) {
                cart.splice(cartIndex, 1);
            }
            filterMenu();
            renderCart();
        }

        function clearCart() {
            cart = [];
            filterMenu();
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-center py-8">Chưa có món nào được chọn</p>`;
                document.getElementById('total-amount').innerText = '0 đ';
                return;
            }

            let total = 0;
            container.innerHTML = cart.map((item, idx) => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                return `
                    <div class="flex justify-between items-center bg-gray-50 p-2.5 rounded-lg border text-sm">
                        <div class="flex-1 pr-2">
                            <p class="font-medium text-gray-800">${item.name}</p>
                            <p class="text-xs text-gray-500">${formatMoney(item.price)} x ${item.quantity}</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="updateQuantity(${idx}, -1)" class="w-6 h-6 bg-gray-200 rounded text-gray-700 font-bold hover:bg-gray-300">-</button>
                            <span class="text-xs font-semibold w-4 text-center">${item.quantity}</span>
                            <button onclick="updateQuantity(${idx}, 1)" class="w-6 h-6 bg-gray-200 rounded text-gray-700 font-bold hover:bg-gray-300">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('total-amount').innerText = formatMoney(total);
        }

        function checkout() {
            if (cart.length === 0) {
                alert('Vui lòng chọn món trước khi thanh toán!');
                return;
            }
            const typeText = currentType === 'mang_di' ? 'Mang đi' : 'Ăn tại quán';
            let total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            alert(`Thanh toán thành công!\nHình thức: ${typeText}\nTổng tiền: ${formatMoney(total)}`);
            cart = [];
            filterMenu();
            renderCart();
        }

        // Khởi chạy khi tải trang
        renderMenu();
    </script>
</body>
</html>
